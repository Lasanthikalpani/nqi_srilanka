<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - NQI Sri Lanka</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #0d47a1;
            --secondary-color: #a13e0d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .admin-login-card {
            width: 100%;
            max-width: 450px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .admin-login-header {
            background: linear-gradient(135deg, var(--primary-color), #1a73e8);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .admin-login-header h2 {
            margin: 0;
            font-weight: 700;
        }

        .admin-login-body {
            padding: 30px;
            background: white;
        }

        .btn-admin-login {
            background: linear-gradient(135deg, var(--primary-color), #1a73e8);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            font-weight: 600;
        }

        .btn-admin-login:hover {
            background: linear-gradient(135deg, #0a3a7a, #0d47a1);
        }
    </style>
</head>

<body>
    <div class="admin-login-card">
        <div class="admin-login-header">
            <h2><i class="fas fa-lock"></i> Admin Portal</h2>
        </div>
        <div class="admin-login-body">
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" class="form-control" id="adminEmail" name="adminEmail" required>
                    <div class="invalid-feedback">Please enter a valid email address</div>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" class="form-control" id="adminPassword" name="adminPassword" required>
                    <div class="invalid-feedback">Please enter your password</div>
                </div>
                <div id="loginError" class="alert alert-danger d-none"></div>
                <button type="submit" class="btn btn-admin-login">
                    <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    Login
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            // Handle form submission
            $('#adminLoginForm').submit(function (e) {
                e.preventDefault();

                // Reset validation
                $('.is-invalid').removeClass('is-invalid');
                $('#loginError').addClass('d-none');

                // Get form values
                const email = $('#adminEmail').val().trim();
                const password = $('#adminPassword').val().trim();

                // Client-side validation
                let isValid = true;
                if (!email) {
                    $('#adminEmail').addClass('is-invalid');
                    isValid = false;
                }
                if (!password) {
                    $('#adminPassword').addClass('is-invalid');
                    isValid = false;
                }
                if (!isValid) return;

                // Show loading spinner
                $('#loginSpinner').removeClass('d-none');
                $('button[type="submit"]').prop('disabled', true);

                // Send login request
                $.ajax({
                    url: 'admin_login.php',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        adminEmail: email,
                        adminPassword: password
                    }),
                    dataType: 'json',
                    success: function (response) {
                        if (response.success) {
                            // Store token in localStorage
                            localStorage.setItem('admin_token', response.token);
                            // Redirect to dashboard
                            window.location.href = response.redirect;
                        } else {
                            showError(response.error || 'Login failed');
                        }
                    },
                    error: function (xhr) {
                        let errorMsg = 'An error occurred during login';
                        if (xhr.responseJSON && xhr.responseJSON.error) {
                            errorMsg = xhr.responseJSON.error;
                        }
                        showError(errorMsg);
                    },
                    complete: function () {
                        $('#loginSpinner').addClass('d-none');
                        $('button[type="submit"]').prop('disabled', false);
                    }
                });
            });

            function showError(message) {
                $('#loginError').text(message).removeClass('d-none');
            }

            // Check for URL errors
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');

            if (error) {
                let errorMsg = 'An error occurred';
                if (error === 'invalid_credentials') {
                    errorMsg = 'Invalid email or password';
                } else if (error === 'not_admin') {
                    errorMsg = 'You do not have admin privileges';
                } else if (error === 'login_required') {
                    errorMsg = 'Please login to access admin panel';
                } else if (error === 'session_expired') {
                    errorMsg = 'Your session has expired. Please login again.';
                }
                showError(errorMsg);
            }
        });
    </script>
</body>

</html>
