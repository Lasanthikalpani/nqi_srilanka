<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - NQI Sri Lanka</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #1abc9c;
            --light: #ecf0f1;
            --dark: #34495e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary), #1a3c5a);
            color: white;
            min-height: 100vh;
            position: fixed;
            width: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
            min-height: 100vh;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            margin: 5px 15px;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .nav-link:hover,
        .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary), var(--dark));
            color: white;
            padding: 18px 25px;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .card-header i {
            margin-right: 10px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: var(--light);
            font-weight: 600;
            color: var(--dark);
            text-transform: uppercase;
            font-size: 0.875rem;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
            border: none;
        }

        .btn-danger:hover {
            background-color: #c0392b;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.3);
        }

        .logo-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 2rem;
            color: white;
            margin-bottom: 10px;
        }

        .sidebar h4 {
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
        }

        /* Toast notification styles */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1100;
        }

        .toast {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s;
            margin-bottom: 15px;
            max-width: 350px;
        }

        .toast-header {
            padding: 12px 15px;
            font-weight: 600;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toast-success .toast-header {
            background-color: var(--accent);
        }

        .toast-error .toast-header {
            background-color: #e74c3c;
        }

        .toast-body {
            padding: 15px;
            color: var(--dark);
        }

        .close {
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .close:hover {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo-header">
            <div class="logo">
                <i class="fas fa-landmark"></i>
            </div>
            <h4>NQI Sri Lanka</h4>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#"><i class="fas fa-users"></i> Users</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="stakeholderLink"><i class="fas fa-building"></i> Stakeholder</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="documentsLink"><i class="fas fa-file-alt"></i> Documents</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="admin_logout.php"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-users"></i> User Management
                </div>
                <div class="card-body">
                    <div class="overflow-x-auto rounded-lg">
                        <table id="usersTable" class="min-w-full">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Organization</th>
                                    <th>User Type</th>
                                    <th>Admin</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Users will be loaded here via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast notification container -->
    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            // Check for token on page load
            const token = localStorage.getItem('admin_token');
            if (!token) {
                window.location.href = 'admin_login.html?error=login_required';
                return;
            }

            // Set token in headers for all AJAX requests
            $.ajaxSetup({
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            // Load users data
            loadUsers();

            function loadUsers() {
                $.ajax({
                    url: 'admin_get_users.php',
                    type: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        if (data.status === 'error' && data.message === 'Access denied. Invalid or missing token.') {
                            window.location.href = 'admin_login.html?error=session_expired';
                            return;
                        }

                        let tableBody = $('#usersTable tbody');
                        tableBody.empty();

                        data.data.forEach(function (user) {
                            let row = `
                                <tr data-id="${user.id}">
                                    <td>${user.id}</td>
                                    <td>${user.first_name} ${user.last_name}</td>
                                    <td>${user.email}</td>
                                    <td>${user.organization || '-'}</td>
                                    <td>${user.user_type}</td>
                                    <td>${user.is_admin ? 'Yes' : 'No'}</td>
                                    <td class="flex space-x-2">
                                        <button class="btn btn-primary edit-user" data-id="${user.id}">
                                            <i class="fas fa-edit mr-1"></i> Edit
                                        </button>
                                        <button class="btn btn-danger delete-user" data-id="${user.id}">
                                            <i class="fas fa-trash-alt mr-1"></i> Delete
                                        </button>
                                    </td>
                                </tr>
                            `;
                            tableBody.append(row);
                        });
                    },
                    error: function (xhr) {
                        if (xhr.status === 403) {
                            window.location.href = 'admin_login.html?error=session_expired';
                        } else {
                            showToast('Error loading users: ' + xhr.statusText, 'error');
                        }
                    }
                });
            }

            // Delete user handler
            $(document).on('click', '.delete-user', function () {
                const userId = $(this).data('id');
                const row = $(this).closest('tr');
                const userName = row.find('td:eq(1)').text();

                if (confirm(`Are you sure you want to delete ${userName}? This action cannot be undone.`)) {
                    $.ajax({
                        url: 'admin_delete_user.php',
                        type: 'POST',
                        data: JSON.stringify({ id: userId }),
                        contentType: 'application/json',
                        dataType: 'json',
                        success: function (response) {
                            if (response.success) {
                                row.fadeOut(300, function () {
                                    $(this).remove();
                                    showToast(response.message || 'User deleted successfully', 'success');
                                });
                            } else {
                                showToast(response.message || 'Error deleting user', 'error');
                            }
                        },
                        error: function (xhr) {
                            if (xhr.status === 403) {
                                window.location.href = 'admin_login.html?error=session_expired';
                            } else {
                                const errorMsg = xhr.responseJSON?.message || xhr.statusText;
                                showToast('Error deleting user: ' + errorMsg, 'error');
                            }
                        }
                    });
                }
            });

            // Handle stakeholder navigation
            $('#stakeholderLink').click(function (e) {
                e.preventDefault();
                window.location.href = 'admin_stakeholder.html';
            });

            // Handle documents navigation
            $('#documentsLink').click(function (e) {
                e.preventDefault();
                window.location.href = 'admin_documents.html';
            });

            // Handle logout
            $('.nav-link').eq(4).click(function (e) { // Changed index to 4 since it's now the 5th item
                e.preventDefault();
                $.ajax({
                    url: 'admin_logout.php',
                    type: 'GET',
                    success: function () {
                        localStorage.removeItem('admin_token');
                        window.location.href = 'admin_login.html';
                    },
                    error: function () {
                        localStorage.removeItem('admin_token');
                        window.location.href = 'admin_login.html';
                    }
                });
            });

            // Toast notification function
            function showToast(message, type = 'success') {
                const toastId = 'toast-' + Date.now();
                const toast = $(`
                    <div id="${toastId}" class="toast toast-${type} show">
                        <div class="toast-header">
                            <strong>Notification</strong>
                            <span class="close">&times;</span>
                        </div>
                        <div class="toast-body">
                            ${message}
                        </div>
                    </div>
                `);

                $('.toast-container').append(toast);

                // Auto-hide after 5 seconds
                setTimeout(() => {
                    $(`#${toastId}`).fadeOut(300, function () {
                        $(this).remove();
                    });
                }, 5000);

                // Manual close handler
                toast.find('.close').click(function () {
                    $(`#${toastId}`).fadeOut(300, function () {
                        $(this).remove();
                    });
                });
            }
        });
    </script>
</body>

</html>
