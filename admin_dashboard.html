<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - NQI Sri Lanka</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #0d47a1;
            --secondary-color: #a13e0d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary-color), #1a73e8);
            color: white;
            min-height: 100vh;
            position: fixed;
            width: 250px;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 15px;
            margin: 5px 0;
        }

        .nav-link:hover,
        .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color), #1a73e8);
            color: white;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="p-4">
            <h4 class="text-center mb-4">NQI Sri Lanka</h4>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="#"><i class="fas fa-tachometer-alt mr-2"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fas fa-users mr-2"></i> Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-users mr-2"></i> User Management</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="usersTable" class="table table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Organization</th>
                                    <th>User Type</th>
                                    <th>Admin</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Users will be loaded here via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            // Check for token on page load
            const token = localStorage.getItem('admin_token');
            if (!token) {
                window.location.href = 'admin_login.html?error=login_required';
                return;
            }

            // Set token in headers for all AJAX requests
            $.ajaxSetup({
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            // Load users data
            loadUsers();

            function loadUsers() {
                $.ajax({
                    url: 'admin_get_users.php',
                    type: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        if (data.status === 'error' && data.message === 'Access denied. Invalid or missing token.') {
                            window.location.href = 'admin_login.html?error=session_expired';
                            return;
                        }

                        let tableBody = $('#usersTable tbody');
                        tableBody.empty();

                        data.data.forEach(function (user) {
                            let row = `
                                <tr data-id="${user.id}">
                                    <td>${user.id}</td>
                                    <td>${user.first_name} ${user.last_name}</td>
                                    <td>${user.email}</td>
                                    <td>${user.organization || '-'}</td>
                                    <td>${user.user_type}</td>
                                    <td>${user.is_admin ? 'Yes' : 'No'}</td>
                                    <td>
                                        <button class="btn btn-sm btn-primary edit-user" data-id="${user.id}">
                                            <i class="fas fa-edit"></i> Edit
                                        </button>
                                       <button class="btn btn-sm btn-danger delete-user" data-id="${user.id}">
    <i class="fas fa-trash"></i> Delete
</button>
                                    </td>
                                </tr>
                            `;
                            tableBody.append(row);
                        });
                    },
                    error: function (xhr) {
                        if (xhr.status === 403) {
                            window.location.href = 'admin_login.html?error=session_expired';
                        } else {
                            alert('Error loading users: ' + xhr.statusText);
                        }
                    }
                });
            }

            // Handle logout
            $('.nav-link').eq(2).click(function (e) {
                e.preventDefault();
                localStorage.removeItem('admin_token');
                window.location.href = 'admin_login.html';
            });
        });
    </script>
</body>

</html>
