<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Document Submissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-pending { color: #ffc107; }
        .status-approved { color: #28a745; }
        .status-rejected { color: #dc3545; }
        .submission-card { margin-bottom: 20px; border-left: 4px solid; }
        .submission-pending { border-left-color: #ffc107; }
        .submission-approved { border-left-color: #28a745; }
        .submission-rejected { border-left-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Document Submissions</h1>
        
        <div id="submissions-container">
            <!-- Submissions will be loaded here via JavaScript -->
            <div class="text-center my-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading submissions...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadSubmissions();
            
            function loadSubmissions() {
                fetch('admin_responses.php')
                    .then(response => response.json())
                    .then(data => {
                        const container = document.getElementById('submissions-container');
                        
                        if (data.length === 0) {
                            container.innerHTML = '<div class="alert alert-info">No document submissions found.</div>';
                            return;
                        }
                        
                        let html = '';
                        data.forEach(submission => {
                            const statusClass = `status-${submission.status}`;
                            const submissionClass = `submission-${submission.status}`;
                            
                            html += `
                                <div class="card submission-card ${submissionClass} mb-3">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <h5 class="card-title">${submission.document_title}</h5>
                                                <h6 class="card-subtitle mb-2 text-muted">
                                                    Submitted by: ${submission.first_name} ${submission.last_name}
                                                </h6>
                                                <p class="card-text">
                                                    <small class="text-muted">
                                                        Submitted on: ${new Date(submission.submitted_at).toLocaleString()}
                                                    </small>
                                                </p>
                                                <p class="card-text">
                                                    File: <a href="${submission.file_path}" target="_blank">${submission.file_name}</a>
                                                </p>
                                            </div>
                                            <div class="d-flex flex-column align-items-end">
                                                <span class="badge rounded-pill ${statusClass} mb-2">${submission.status}</span>
                                                <div class="btn-group">
                                                    <button class="btn btn-sm ${submission.status === 'approved' ? 'btn-success' : 'btn-outline-success'}" 
                                                            onclick="updateStatus(${submission.id}, 'approved')">
                                                        Approve
                                                    </button>
                                                    <button class="btn btn-sm ${submission.status === 'rejected' ? 'btn-danger' : 'btn-outline-danger'}" 
                                                            onclick="updateStatus(${submission.id}, 'rejected')">
                                                        Reject
                                                    </button>
                                                    <button class="btn btn-sm ${submission.status === 'pending' ? 'btn-warning' : 'btn-outline-warning'}" 
                                                            onclick="updateStatus(${submission.id}, 'pending')">
                                                        Pending
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        
                        container.innerHTML = html;
                    })
                    .catch(error => {
                        console.error('Error loading submissions:', error);
                        document.getElementById('submissions-container').innerHTML = `
                            <div class="alert alert-danger">
                                Failed to load submissions. Please try again later.
                            </div>
                        `;
                    });
            }
            
            window.updateStatus = function(submissionId, status) {
                fetch('admin_responses.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `action=update_status&submission_id=${submissionId}&status=${status}`
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadSubmissions(); // Refresh the list
                    } else {
                        alert('Failed to update status: ' + (data.error || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error updating status:', error);
                    alert('Failed to update status. Please try again.');
                });
            };
        });
    </script>
</body>
</html>
