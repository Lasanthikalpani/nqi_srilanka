<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Document Submissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-pending {
            color: #ffc107;
        }

        .status-approved {
            color: #28a745;
        }

        .status-rejected {
            color: #dc3545;
        }

        .submission-card {
            margin-bottom: 20px;
            border-left: 4px solid;
        }

        .submission-pending {
            border-left-color: #ffc107;
        }

        .submission-approved {
            border-left-color: #28a745;
        }

        .submission-rejected {
            border-left-color: #dc3545;
        }

        .response-form {
            display: none;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h1 class="mb-4">Document Submissions</h1>

        <!-- Modal for response upload -->
        <div class="modal fade" id="responseModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="responseModalTitle">Upload Response</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="responseForm" enctype="multipart/form-data">
                            <input type="hidden" id="modalSubmissionId" name="submission_id">
                            <input type="hidden" id="modalStatus" name="status">
                            <div class="mb-3">
                                <label for="responseFile" class="form-label">Response PDF</label>
                                <input class="form-control" type="file" id="responseFile" name="response_file"
                                    accept=".pdf" required>
                            </div>
                            <div class="mb-3">
                                <label for="comments" class="form-label">Comments (Optional)</label>
                                <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="submitResponse()">Submit
                            Response</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="submissions-container">
            <!-- Submissions will be loaded here via JavaScript -->
            <div class="text-center my-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading submissions...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadSubmissions();

            function loadSubmissions() {
                fetch('admin_responses.php')
                    .then(response => response.json())
                    .then(data => {
                        const container = document.getElementById('submissions-container');

                        if (data.length === 0) {
                            container.innerHTML = '<div class="alert alert-info">No document submissions found.</div>';
                            return;
                        }

                        let html = '';
                        data.forEach(submission => {
                            const statusClass = `status-${submission.status}`;
                            const submissionClass = `submission-${submission.status}`;

                            // Check if there's a response file
                            const responseFile = submission.response_file_path ?
                                `<p class="card-text">
                                    Response: <a href="${submission.response_file_path}" target="_blank">${submission.response_file_name || 'View Response'}</a>
                                </p>` : '';

                            html += `
                                <div class="card submission-card ${submissionClass} mb-3">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <h5 class="card-title">${submission.document_title}</h5>
                                                <h6 class="card-subtitle mb-2 text-muted">
                                                    Submitted by: ${submission.first_name} ${submission.last_name}
                                                </h6>
                                                <p class="card-text">
                                                    <small class="text-muted">
                                                        Submitted on: ${new Date(submission.submitted_at).toLocaleString()}
                                                    </small>
                                                </p>
                                                <p class="card-text">
                                                    File: <a href="${submission.file_path}" target="_blank">${submission.file_name}</a>
                                                </p>
                                                ${responseFile}
                                            </div>
                                            <div class="d-flex flex-column align-items-end">
                                                <span class="badge rounded-pill ${statusClass} mb-2">${submission.status}</span>
                                                <div class="btn-group">
                                                    <button class="btn btn-sm ${submission.status === 'approved' ? 'btn-success' : 'btn-outline-success'}" 
                                                            onclick="prepareResponse(${submission.id}, 'approved')">
                                                        Approve
                                                    </button>
                                                    <button class="btn btn-sm ${submission.status === 'rejected' ? 'btn-danger' : 'btn-outline-danger'}" 
                                                            onclick="prepareResponse(${submission.id}, 'rejected')">
                                                        Reject
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        container.innerHTML = html;
                    })
                    .catch(error => {
                        console.error('Error loading submissions:', error);
                        document.getElementById('submissions-container').innerHTML = `
                            <div class="alert alert-danger">
                                Failed to load submissions. Please try again later.
                            </div>
                        `;
                    });
            }

            window.prepareResponse = function (submissionId, status) {
                document.getElementById('modalSubmissionId').value = submissionId;
                document.getElementById('modalStatus').value = status;

                const modalTitle = document.getElementById('responseModalTitle');
                modalTitle.textContent = status === 'approved' ? 'Upload Approval Response' : 'Upload Rejection Response';

                const modal = new bootstrap.Modal(document.getElementById('responseModal'));
                modal.show();
            };

            window.submitResponse = function () {
                const form = document.getElementById('responseForm');
                const formData = new FormData(form);

                fetch('admin_responses.php', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Close the modal and refresh the list
                            const modal = bootstrap.Modal.getInstance(document.getElementById('responseModal'));
                            modal.hide();
                            loadSubmissions();
                        } else {
                            alert('Failed to submit response: ' + (data.error || 'Unknown error'));
                        }
                    })
                    .catch(error => {
                        console.error('Error submitting response:', error);
                        alert('Failed to submit response. Please try again.');
                    });
            };
        });
    </script>
</body>

</html>
